<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083B37" />
      <stop offset="50%" stop-color="#0B4D47" />
      <stop offset="100%" stop-color="#052825" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="mintLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6FFFA" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="116" stroke="url(#emeraldGlow)" stroke-width="6" stroke-opacity="0.6" />
  <rect x="36" y="36" width="440" height="440" rx="104" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" fill="none" />

  <!-- Protective Health Heart Arc -->
  <path d="M256 128 C204 84, 116 112, 116 198 C116 276, 194 346, 256 394 C318 346, 396 276, 396 198 C396 112, 308 84, 256 128 Z" 
        fill="none" 
        stroke="url(#emeraldGlow)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-opacity="0.32" />

  <!-- Premium Medical Cross -->
  <g filter="url(#glow)">
    <rect x="220" y="142" width="72" height="228" rx="20" fill="url(#mintLight)" />
    <rect x="142" y="220" width="228" height="72" rx="20" fill="url(#mintLight)" />
  </g>

  <!-- Vitality Pulse Lifeline -->
  <path d="M152 256 L196 256 L220 206 L244 306 L272 234 L292 270 L312 256 L360 256" 
        fill="none" 
        stroke="#0B4D47" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <path d="M152 256 L196 256 L220 206 L244 306 L272 234 L292 270 L312 256 L360 256" 
        fill="none" 
        stroke="url(#emeraldGlow)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Luxury Gold Sparkle of Excellence -->
  <path d="M370 134 Q382 146 394 146 Q382 146 370 158 Q358 146 346 146 Q358 146 370 134 Z" fill="url(#goldAccent)" />
  <circle cx="370" cy="146" r="3.2" fill="#FFFBEB" />
</svg>
